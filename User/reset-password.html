<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliora - Reset Password</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Update Password</h1>
            <p>Enter your new password below</p>
        </div>

        <form class="login-form" id="resetPasswordForm">
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="New password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password"
                    required>
            </div>

            <button type="submit" class="login-btn">Update Password</button>
        </form>
    </div>

    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (newPassword !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            try {
                // Supabase will automatically pick up the session from the URL hash
                const { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    alert('Error updating password: ' + error.message);
                } else {
                    alert('Password has been successfully updated! Please log in.');
                    window.location.href = 'login.html';
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred.');
            }
        });
    </script>
</body>

</html>
